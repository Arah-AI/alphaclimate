# Docker Swarm stack for the tradevantage box (Dokploy's swarm + Traefik).
# Images are built by GitHub Actions on a native amd64 runner and published to
# GHCR. This host cannot build them: it runs the live TradeVantage services in
# ~3.8 GB with roughly 1.3 GB free, and a Next build there gets OOM-killed.
# Memory limits below are ceilings so this stack can never starve those.
version: "3.8"

services:
  api:
    image: ghcr.io/rafieamandio/alphaclimate-api:latest
    networks: [dokploy-network]
    environment:
      ALPHACLIMATE_CURVES: /srv/data/damage_curves.json
      ALPHACLIMATE_HAZARD_CACHE: /srv/data/hazard_cache.json
    deploy:
      replicas: 1
      restart_policy: { condition: any }
      resources:
        limits: { memory: 512M }

  web:
    image: ghcr.io/rafieamandio/alphaclimate-web:latest
    networks: [dokploy-network]
    environment:
      API_URL: http://api:8000
    deploy:
      replicas: 1
      restart_policy: { condition: any }
      resources:
        limits: { memory: 384M }

networks:
  dokploy-network:
    external: true
