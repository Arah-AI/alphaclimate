# Docker Swarm stack for the tradevantage box (Dokploy's swarm + Traefik).
# Images are built for linux/amd64 on a workstation and shipped with
# docker save | ssh docker load, so no registry credentials are needed and the
# code never lands in a public image.
# This host has ~1.3 GB free and a Next build would OOM on it.
version: "3.8"

services:
  api:
    image: alphaclimate-api:latest
    networks: [dokploy-network]
    environment:
      ALPHACLIMATE_CURVES: /srv/data/damage_curves.json
      ALPHACLIMATE_HAZARD_CACHE: /srv/data/hazard_cache.json
    deploy:
      replicas: 1
      restart_policy: { condition: any }
      resources:
        limits: { memory: 512M }

  web:
    image: alphaclimate-web:latest
    networks: [dokploy-network]
    environment:
      API_URL: http://api:8000
    deploy:
      replicas: 1
      restart_policy: { condition: any }
      resources:
        limits: { memory: 384M }

networks:
  dokploy-network:
    external: true
